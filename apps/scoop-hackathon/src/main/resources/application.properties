# ============================================================================
# Application Configuration
# ============================================================================
# Values are loaded from .env file or environment variables
# See .env.example for all available configuration options
#
# Environment-specific configurations are available:
#   - application-local.properties (for local development)
#   - application-dev.properties (for development/staging)
#   - application-prod.properties (for production)
#
# Activate a profile using:
#   - Environment variable: SPRING_PROFILES_ACTIVE=local
#   - Command line: --spring.profiles.active=local
#   - IDE run configuration: Add VM option -Dspring.profiles.active=local
#
# Default profile is used if no profile is specified
spring.application.name=${APP_NAME:scoop-hackathon}
server.port=${SERVER_PORT:8080}

# ============================================================================
# Database Configuration - MySQL
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gitguard_agent?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ============================================================================
# JPA/Hibernate Configuration
# ============================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JPA Properties
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=false

# Connection Pool Settings (HikariCP - default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# MySQL-specific optimizations
spring.datasource.hikari.connection-test-query=SELECT 1
# Temporarily disabled to fix transaction commit issues
# spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================================
# Flyway Database Migration Configuration
# ============================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}
spring.flyway.clean-disabled=true
spring.flyway.ignore-missing-migrations=true
spring.flyway.repair-on-migrate=true

# ============================================================================
# JSON/Jackson Configuration
# ============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.scoop.hackathon=${LOG_LEVEL_APP:DEBUG}

# ============================================================================
# Server Configuration
# ============================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ============================================================================
# JWT Configuration
# ============================================================================
# JWT Secret Key (should be at least 32 characters, set via environment variable)
jwt.secret=${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProductionEnvironmentMinimum32Characters}
# JWT Expiration time in milliseconds (default: 86400000 = 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================================
# Swagger/OpenAPI Configuration
# ============================================================================
# Enable/disable Swagger UI (default: true)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
# Swagger UI path (default: /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
# API docs path (default: /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs
# Show operations in Swagger UI (default: true)
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Try it out enabled by default
springdoc.swagger-ui.tryItOutEnabled=true
# Show request duration
springdoc.swagger-ui.displayRequestDuration=true
# Filter endpoints
springdoc.swagger-ui.filter=true

# ============================================================================
# Web/UI Configuration
# ============================================================================
# Favicon configuration - Spring Boot will look for favicon.ico in static resources
# Place favicon.ico in src/main/resources/static/ or src/main/resources/public/
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

